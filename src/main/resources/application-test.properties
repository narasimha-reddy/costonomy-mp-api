# Integration tests. The datasource URL is supplied by Testcontainers at runtime
# (see AbstractIntegrationTest), so nothing is hard-coded here.
spring.jpa.show-sql=false
logging.level.com.costonomy.mp=INFO
logging.level.org.testcontainers=WARN
# costonomy-common-api is faked in-process (support/LocalCommon); nothing is published or called.
costonomy.mp.catalog.publish=false

# Background sweeps are driven explicitly by the tests that care about them.
# Left on their production cadence they fire between a test's arrange and assert
# steps and make unrelated tests fail intermittently.
costonomy.mp.orders.timeout-poll-interval=PT1H
costonomy.mp.outbox.poll-interval=PT1H
# Tests drain the outbox themselves; the after-commit drain (D-191) would deliver events between arrange and assert.
costonomy.mp.outbox.drain-on-commit=false
costonomy.mp.payments.capture-interval=PT1H
costonomy.mp.order-adjustments.apply-interval=PT1H
costonomy.mp.payments.reconcile-interval=PT1H
costonomy.mp.payments.refund-interval=PT1H
costonomy.mp.payments.cancel-interval=PT1H
costonomy.mp.payments.refund-audit-interval=PT1H
costonomy.mp.payments.reversal-audit-interval=PT1H
# A rejected refund is verified and reversed in the same run in tests; production waits two minutes
# after the send for the provider's list to catch up (D-110). One test sets it back to prove the wait.
costonomy.mp.refunds.reversal-min-age=PT0S
# Likewise for a person putting an ambiguous refund back (D-110): one test sets it back to prove the wait.
costonomy.mp.refunds.recredit-min-age=PT0S
costonomy.mp.credit.overdue-interval=PT1H
costonomy.mp.credit.offer-expiry-interval=PT1H
# Reminders to restaurants (D-171): releases the ones queued for the 09:00 IST window and sends the automatic ones.
costonomy.mp.credit.reminder-interval=PT1H
# The supplier's daily credit digest (D-173): looked at every interval, sent once per store per India day from this time.
costonomy.mp.credit.digest-interval=PT10M
costonomy.mp.credit.digest-time=08:30
costonomy.mp.delivery.poll-interval=PT1H
costonomy.mp.realtime.cleanup-interval=PT1H
costonomy.mp.notifications.dispatch-interval=PT1H
costonomy.mp.quickscan.payout-interval=PT1H
costonomy.mp.wallet.top-up-poll-interval=PT1H
costonomy.mp.wallet.top-up-refund-interval=PT1H
# Credit payments online (D-199): off by default; ITs switch it on. Jobs never run on their own; ITs call them directly.
costonomy.mp.credit.online-pay.poll-interval=PT1H
costonomy.mp.credit.online-pay.refund-interval=PT1H

# Rate limits off by default: the suite creates hundreds of users from one
# address, and throttling its own fixtures would test the fixtures. RateLimitIT
# turns them back on for itself.
costonomy.mp.ratelimit.search=0
costonomy.mp.ratelimit.payment=0
costonomy.mp.ratelimit.webhook=0
costonomy.mp.ratelimit.admin-mutation=0
costonomy.mp.ratelimit.delivery-request=0
costonomy.mp.ratelimit.delivery-reassign=0
costonomy.mp.ratelimit.delivery-cancel=0
costonomy.mp.ratelimit.delivery-read=0
costonomy.mp.invoices.lookups.per-minute=0
costonomy.mp.settlement.generation-interval=PT1H
costonomy.mp.settlement.reconcile-interval=PT1H
costonomy.mp.invoices.retry-interval=PT1H
# Tests drive the retry job by hand; a bill is due as soon as it has been tried once.
costonomy.mp.invoices.retry-min-age=PT0S
# Tests run with every outlet on one cost outlet (the fallback, never allowed in production); the outlet-map tests
# switch it off.
costonomy.mp.invoices.cost-outlet-fallback=true
costonomy.mp.invoices.reader.outlet=5
costonomy.mp.subscriptions.generation-cron=-

# Console only, no log file; no configuration list in every test context
logging.file.name=
costonomy.startup.log-config=false

# The local web builds may open a realtime socket (as in the dev profile); RealtimeFlowIT checks it
costonomy.mp.realtime.allowed-origins=http://localhost:7071,http://127.0.0.1:7071,http://localhost:7074,http://127.0.0.1:7074,http://localhost:19006,http://localhost:8081,http://127.0.0.1:8081
# A fixed-delay job also runs once as soon as the context starts. For the reminder job that first run raced the first test of
# CreditReminderJobIT under load and failed it; the tests call the job themselves.
costonomy.mp.credit.reminder-initial-delay=PT1H

# The delivery status poll also runs once as soon as the context starts, on its own thread, while the test class is
# still seeding. That first run polled seeded deliveries before the provider was stubbed; the tests call the job.
costonomy.mp.delivery.poll-initial-delay=PT1H
# Same reason for the overdue, offer-expiry and digest jobs: their start-up run raced the credit tests (a stubbed
# Clock, an invoice read back). The tests call the jobs themselves.
costonomy.mp.credit.jobs-initial-delay=PT1H
