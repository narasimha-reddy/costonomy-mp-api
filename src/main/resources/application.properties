# ── Costonomy MP API ─────────────────────────────────────────────────────
# Deployed as a WAR alongside costonomy-api, so the context path mirrors that
# convention. Full base path: /costonomy-mp-api/api/v1/...
server.servlet.context-path=/costonomy-mp-api
server.port=8080

spring.application.name=costonomy-mp-api
spring.profiles.active=${SPRING_PROFILE:local}

# Honour X-Forwarded-* from the load balancer so getRemoteAddr() is the real
# client IP. The OTP and login rate limiters key on it; behind an ELB without
# this, every request appears to come from the balancer and one abusive client
# would throttle everyone.
server.forward-headers-strategy=NATIVE

# ── Database ─────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:costonomy_mp}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:3}
spring.datasource.hikari.connection-timeout=30000

# ── JPA ──────────────────────────────────────────────────────────────────
# Flyway owns the schema (D-002). `validate` means the app refuses to start if
# an entity and its table have drifted — which is the point: a mismatch found at
# startup is a deploy that fails, not a column that silently reads as null.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Everything is stored and compared in UTC (doc 02 §1). Conversion to a user's
# timezone happens at presentation, never in the database.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ── Flyway ───────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
# A checksum mismatch means an already-applied migration file was edited. Never
# "repair" past that — fix forward with a new migration, or environments silently
# diverge from each other.
spring.flyway.validate-on-migrate=true

# ── Redis ────────────────────────────────────────────────────────────────
# Cache, rate limiting and short-lived coordination only. Never authoritative
# for money, orders or credit (guardrail 6).
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# ── Security ─────────────────────────────────────────────────────────────
# No default. The app fails to start without it rather than signing tokens with
# a well-known fallback that would ship to production unnoticed.
costonomy.mp.jwt.secret=${JWT_SECRET}
costonomy.mp.jwt.access-token-ttl=15m
costonomy.mp.jwt.refresh-token-ttl=30d
costonomy.mp.jwt.issuer=costonomy-mp

# ── OTP (doc 09 §1) ──────────────────────────────────────────────────────
costonomy.mp.otp.length=6
costonomy.mp.otp.ttl=5m
costonomy.mp.otp.max-attempts=5
costonomy.mp.otp.resend-cooldown=60s
costonomy.mp.otp.max-requests-per-hour=10

# ── Providers ────────────────────────────────────────────────────────────
# Every external dependency sits behind a port with a mock implementation, and
# local development and CI run entirely on mocks (doc 10 §6, §7).
costonomy.mp.providers.otp=${OTP_PROVIDER:MOCK}
costonomy.mp.providers.payment=${PAYMENT_PROVIDER:MOCK}
costonomy.mp.providers.delivery=${DELIVERY_PROVIDER:MOCK}
costonomy.mp.providers.notification=${NOTIFICATION_PROVIDER:MOCK}

# Razorpay. Required only when PAYMENT_PROVIDER=RAZORPAY; the mock needs none of
# them, which is what keeps local development and CI free of real credentials.
# Never commit values here — these are environment variables on purpose.
costonomy.mp.razorpay.base-url=${RAZORPAY_BASE_URL:https://api.razorpay.com}
costonomy.mp.razorpay.key-id=${RAZORPAY_KEY_ID:}
costonomy.mp.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
costonomy.mp.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# ── Payments ─────────────────────────────────────────────────────────────
# Capture runs often because an authorisation lapses if it is left uncaptured.
# Reconciliation runs slower: it exists for the customer whose client died after
# paying, and asking the provider about every payment is not free.
costonomy.mp.payments.capture-interval=PT10S
costonomy.mp.payments.reconcile-interval=PT60S
costonomy.mp.payments.refund-interval=PT30S

# ── Business defaults (doc 09 §10 — all runtime-overridable via app_config) ──
# These are startup fallbacks only. The authoritative value is read from
# app_config so operations can change it without a deploy, and so a settlement
# can be reproduced using the rate that applied at the time.
costonomy.mp.orders.default-response-sla=60s
costonomy.mp.commission.default-rate=1.00
costonomy.mp.settlement.default-offset-days=2
costonomy.mp.delivery.location-stale-after=60s

# ── Idempotency ──────────────────────────────────────────────────────────
# How long a completed response stays replayable. Long enough to cover a client
# retrying across a network outage; short enough that the table stays small.
costonomy.mp.idempotency.retention=24h

# ── Observability ────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# requestId comes from RequestIdFilter via MDC, so every line can be traced back
# to one request (doc 09 §15).
logging.pattern.level=%5p [${spring.application.name},%X{requestId:--}]
logging.level.com.costonomy.mp=INFO

# ── OpenAPI ──────────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha

# ── Credit ───────────────────────────────────────────────────────────────
# Overdue is a date boundary, so an hourly sweep finds the same answer as a
# per-minute one would, fifty-nine times less often.
costonomy.mp.credit.overdue-interval=PT1H

# ── Delivery ─────────────────────────────────────────────────────────────
# Polling is the fallback for providers without callbacks, and the safety net for
# callbacks that never arrive. Fast enough that a restaurant watching a map does
# not see a frozen driver.
costonomy.mp.delivery.poll-interval=PT30S

# ── Realtime ─────────────────────────────────────────────────────────────
# LOCAL fans out within this JVM and is correct for a single instance. Switch to
# REDIS when running more than one: the outbox relay holds a ShedLock, so without
# a cross-instance hop only the locked instance's sockets would ever be fed.
costonomy.mp.realtime.broadcaster=${REALTIME_BROADCASTER:LOCAL}
costonomy.mp.realtime.socket-path=/api/v1/realtime/socket
# Seconds. The ticket exists to cross one handshake.
costonomy.mp.realtime.ticket-ttl=30s
# Longer than any plausible offline period. Past it a client refreshes state
# rather than replaying, which doc 05 §16 has it doing on cold start anyway.
costonomy.mp.realtime.event-retention=7d
costonomy.mp.realtime.cleanup-interval=PT1H
