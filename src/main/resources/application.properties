# ── Costonomy MP API ─────────────────────────────────────────────────────
# Deployed as a WAR alongside costonomy-api, so the context path mirrors that
# convention. Full base path: /costonomy-mp-api/api/v1/...
server.servlet.context-path=/costonomy-mp-api
# Overridable so a developer running several apps can move it without an edit.
server.port=${SERVER_PORT:7070}

spring.application.name=costonomy-mp-api
spring.profiles.active=${SPRING_PROFILE:local}

# Honour X-Forwarded-* from the load balancer so getRemoteAddr() is the real
# client IP. The OTP and login rate limiters key on it; behind an ELB without
# this, every request appears to come from the balancer and one abusive client
# would throttle everyone.
server.forward-headers-strategy=NATIVE

# ── Database ─────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:costonomy_mp}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
spring.datasource.username=${MYSQL_USER:appuser}
spring.datasource.password=${MYSQL_PASSWORD:appuser}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:3}
spring.datasource.hikari.connection-timeout=30000

# ── JPA ──────────────────────────────────────────────────────────────────
# Flyway owns the schema (D-002). `validate` means the app refuses to start if
# an entity and its table have drifted — which is the point: a mismatch found at
# startup is a deploy that fails, not a column that silently reads as null.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Everything is stored and compared in UTC (doc 02 §1). Conversion to a user's
# timezone happens at presentation, never in the database.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ── Flyway ───────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
# A checksum mismatch means an already-applied migration file was edited. Never
# "repair" past that — fix forward with a new migration, or environments silently
# diverge from each other.
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=true

# ── Redis ────────────────────────────────────────────────────────────────
# Cache, rate limiting and short-lived coordination only. Never authoritative
# for money, orders or credit (guardrail 6).
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# ── Security ─────────────────────────────────────────────────────────────
# No default. The app fails to start without it rather than signing tokens with
# a well-known fallback that would ship to production unnoticed.
costonomy.mp.jwt.secret=${JWT_SECRET:SWt/kWYyraXKIm3nlqnJSL9vSqmPLkCT7GdZyKa4jDU=}
costonomy.mp.jwt.access-token-ttl=15m
costonomy.mp.jwt.refresh-token-ttl=30d
costonomy.mp.jwt.issuer=costonomy-mp

# ── OTP (doc 09 §1) ──────────────────────────────────────────────────────
costonomy.mp.otp.length=6
costonomy.mp.otp.ttl=5m
costonomy.mp.otp.max-attempts=5
costonomy.mp.otp.resend-cooldown=60s
costonomy.mp.otp.max-requests-per-hour=10

# ── Providers ────────────────────────────────────────────────────────────
# Every external dependency sits behind a port with a mock implementation, and
# local development and CI run entirely on mocks (doc 10 §6, §7).
costonomy.mp.providers.otp=${OTP_PROVIDER:MOCK}
costonomy.mp.providers.payment=${PAYMENT_PROVIDER:MOCK}
costonomy.mp.providers.delivery=${DELIVERY_PROVIDER:MOCK}
costonomy.mp.providers.notification=${NOTIFICATION_PROVIDER:MOCK}
costonomy.mp.providers.payout=${PAYOUT_PROVIDER:MOCK}

# Razorpay. Required only when PAYMENT_PROVIDER=RAZORPAY; the mock needs none of
# them, which is what keeps local development and CI free of real credentials.
# Never commit values here — these are environment variables on purpose.
costonomy.mp.razorpay.base-url=${RAZORPAY_BASE_URL:https://api.razorpay.com}
costonomy.mp.razorpay.key-id=${RAZORPAY_KEY_ID:}
costonomy.mp.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
costonomy.mp.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# How long Razorpay holds an authorised payment for capture before it returns it,
# in minutes (12 to 7200). ONE number drives both the expiry sent with every order
# and how long we let a supplier hand goods over against a hold (66 hours of a
# 3-day hold), so the two cannot disagree (D-109). Razorpay's own documents say
# both three and five days for the longest hold; until Razorpay confirms it, this
# is the shorter, three days (4320). Raising it is safe only if Razorpay accepts
# the larger expiry. It takes effect only for orders made afterwards: each payment
# stores the hold it was created with, and the guard uses that, so orders already
# made keep the limit Razorpay actually applies to them.
costonomy.mp.razorpay.manual-expiry-minutes=${RAZORPAY_MANUAL_EXPIRY_MINUTES:4320}
# How fast the refund of a cancelled, already-debited order is sent: normal
# (Razorpay's default, free, banks take 5 to 7 working days) or optimum (instant
# where Razorpay can, at a per-refund fee that Costonomy pays). Off by default.
costonomy.mp.razorpay.cancel-refund-speed=${RAZORPAY_CANCEL_REFUND_SPEED:normal}

# Pidge Delivery. Required only when DELIVERY_PROVIDER=PIDGE.
costonomy.mp.pidge.base-url=${PIDGE_BASE_URL:https://api.pidge.in}
costonomy.mp.pidge.api-token=${PIDGE_API_TOKEN:}
costonomy.mp.pidge.api-secret=${PIDGE_API_SECRET:}
costonomy.mp.pidge.webhook-secret=${PIDGE_WEBHOOK_SECRET:}
costonomy.mp.pidge.channel-name=${PIDGE_CHANNEL_NAME:MandiMarketplace}
costonomy.mp.pidge.allocation-mode=${PIDGE_ALLOCATION_MODE:SMART}
costonomy.mp.pidge.timeout=5s
costonomy.mp.pidge.rate-limit-rps=20
costonomy.mp.pidge.unassigned-timeout=3m
costonomy.mp.delivery.auto-dispatch.enabled=${DELIVERY_AUTO_DISPATCH:true}

# ── Payments ─────────────────────────────────────────────────────────────
# Capture runs often because an authorisation lapses if it is left uncaptured.
# Reconciliation runs slower: it exists for the customer whose client died after
# paying, and asking the provider about every payment is not free.
costonomy.mp.payments.capture-interval=PT10S
costonomy.mp.payments.reconcile-interval=PT60S
costonomy.mp.payments.refund-interval=PT30S
# Sends a cancelled order's debited money back: frequent, because the restaurant
# is out of pocket until it runs (D-109).
costonomy.mp.payments.cancel-interval=PT15S
# How often the jobs that read the provider's refunds again run (D-110): refunds in review after an
# ambiguous send (hourly, for a week) and refunds put back in a wallet (daily, for two weeks). Each
# refund is only read at its own cadence; this is how often the job looks for one that is due.
costonomy.mp.payments.refund-audit-interval=PT10M
# A refund put back in a wallet is looked for at the provider 10 minutes, 1 hour and 6 hours after, then daily
# for 14 days: money put back can be spent within minutes, so the first look is not a whole interval late.
costonomy.mp.payments.reversal-audit-interval=PT1M

# ── Withdrawals the provider will not send (D-110) ───────────────────────
# Wait after the first send before the provider's refund list is believed to show every refund of ours.
costonomy.mp.refunds.reversal-min-age=PT2M
# A refund whose outcome was never known (a timeout, a 5xx) is not put back by a person until this long after its
# last send: the provider's list of refunds may lag one it has just made.
costonomy.mp.refunds.recredit-min-age=PT30M
# Putting money back in a wallet by hand above this many rupees needs a second person (E-9).
costonomy.mp.refunds.second-approver-above=10000.00
# A payment older than this is not asked to take a withdrawal's refund: Razorpay's window is unverified (V-6).
costonomy.mp.razorpay.refund-window-days=180

# ── Wallet (D-107) ───────────────────────────────────────────────────────
# What a wallet may hold and take in. These are a stand-in for KYC tiers: KYC is
# not being built, so limits keep the exposure small without it, and a future KYC
# tier would raise them per outlet. Rupees.
costonomy.mp.wallet.max-balance=${WALLET_MAX_BALANCE:100000}
costonomy.mp.wallet.monthly-top-up-limit=${WALLET_MONTHLY_TOP_UP_LIMIT:1000000}
costonomy.mp.wallet.min-top-up=${WALLET_MIN_TOP_UP:10}
costonomy.mp.wallet.max-top-up=${WALLET_MAX_TOP_UP:100000}
# The safety nets for a top-up whose confirm never arrived: the poller credits a
# payment the client never reported; the refund job returns one that broke a limit.
costonomy.mp.wallet.top-up-poll-interval=PT30S
costonomy.mp.wallet.top-up-refund-interval=PT30S

# ── QuickScan (D-106) ────────────────────────────────────────────────────
# Pay any UPI merchant from the wallet. Sandbox only — ProductionProviderGuard
# refuses to start under a production profile with this on, or with the payout
# provider left at MOCK, until legal has signed off on paying third parties out
# of a wallet balance.
costonomy.mp.quickscan.enabled=${QUICKSCAN_ENABLED:false}
costonomy.mp.quickscan.max-amount=${QUICKSCAN_MAX_AMOUNT:10000}
# A flat fee in rupees, added to every payment. Zero for now — the fee policy
# is undecided (D-106).
costonomy.mp.quickscan.fee=${QUICKSCAN_FEE:0}
costonomy.mp.quickscan.payout-interval=PT10S

# ── Credit repayment from the wallet (D-123) ─────────────────────────────
# Off until the business decision on commission (D-126) is confirmed. The payout to the supplier now exists
# (a pending row applied by the next settlement); the flag stays off for that decision, not for a missing payout.
costonomy.mp.credit.wallet-repay.enabled=${CREDIT_WALLET_REPAY_ENABLED:false}
# Commission on wallet repayments (D-126), snapshotted per repayment. Default ON per the approved plan; the
# business decision is for the user to confirm. Off: no rate, commission 0.
costonomy.mp.credit.repayment-commission.enabled=${CREDIT_REPAYMENT_COMMISSION_ENABLED:true}

# ── Business defaults (doc 09 §10 — all runtime-overridable via app_config) ──
# These are startup fallbacks only. The authoritative value is read from
# app_config so operations can change it without a deploy, and so a settlement
# can be reproduced using the rate that applied at the time.
costonomy.mp.orders.default-response-sla=60s
costonomy.mp.commission.default-rate=1.00
costonomy.mp.settlement.default-offset-days=2
costonomy.mp.delivery.location-stale-after=60s

# ── Idempotency ──────────────────────────────────────────────────────────
# How long a completed response stays replayable. Long enough to cover a client
# retrying across a network outage; short enough that the table stays small.
costonomy.mp.idempotency.retention=24h

# ── Observability ────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# requestId comes from RequestIdFilter via MDC, so every line can be traced back
# to one request (doc 09 §15) — or to one job run, from CorrelatedTaskScheduler.
# trace carries business ids (" payment=160 order=162 ...") while a TraceScope is
# open, so one search finds a payment's whole sequence (D-100).
logging.pattern.level=%5p [${spring.application.name},%X{requestId:--}]%X{trace:-}
logging.level.com.costonomy.mp=INFO

# ── OpenAPI ──────────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha

# ── Credit ───────────────────────────────────────────────────────────────
# Overdue is a date boundary, so an hourly sweep finds the same answer as a
# per-minute one would, fifty-nine times less often.
costonomy.mp.credit.overdue-interval=PT1H

# ── Scheduling ───────────────────────────────────────────────────────────
# Spring's default is ONE thread for every @Scheduled job in the app — twenty-one
# of them — so a payment sweep waiting on a slow provider delayed captures, the
# outbox relay, notifications and settlement behind it (D-099). ShedLock still
# guarantees each job runs once across instances; fixed-delay jobs never overlap
# themselves, so more threads change who waits, not what runs twice.
spring.task.scheduling.pool.size=${SCHEDULER_THREADS:8}
spring.task.scheduling.thread-name-prefix=job-

# ── Delivery ─────────────────────────────────────────────────────────────
# Polling is the fallback for providers without callbacks, and the safety net for
# callbacks that never arrive. Fast enough that a restaurant watching a map does
# not see a frozen driver.
costonomy.mp.delivery.poll-interval=PT30S
# Secret for signing and validating general delivery provider incoming webhooks
costonomy.mp.delivery.webhook-secret=${DELIVERY_WEBHOOK_SECRET:${PIDGE_WEBHOOK_SECRET:}}

# ── Realtime ─────────────────────────────────────────────────────────────
# LOCAL fans out within this JVM and is correct for a single instance. Switch to
# REDIS when running more than one: the outbox relay holds a ShedLock, so without
# a cross-instance hop only the locked instance's sockets would ever be fed.
costonomy.mp.realtime.broadcaster=${REALTIME_BROADCASTER:LOCAL}
costonomy.mp.realtime.socket-path=/api/v1/realtime/socket
# Seconds. The ticket exists to cross one handshake.
costonomy.mp.realtime.ticket-ttl=30s
# Longer than any plausible offline period. Past it a client refreshes state
# rather than replaying, which doc 05 §16 has it doing on cold start anyway.
costonomy.mp.realtime.event-retention=7d
costonomy.mp.realtime.cleanup-interval=PT1H
# Allowed origins for WebSocket handshake (e.g. Expo web on port 7071 or 8081)
costonomy.mp.realtime.allowed-origins=${REALTIME_ALLOWED_ORIGINS:http://localhost:7071,http://localhost:8081,http://127.0.0.1:7071}

# ── Notifications ────────────────────────────────────────────────────────
# Fast, because the first thing a supplier needs to know is that an order is
# counting down against them.
costonomy.mp.notifications.dispatch-interval=PT10S

# ── Rate limiting (doc 09 §14) ───────────────────────────────────────────
# MEMORY counts in this JVM and is correct for a single instance. Switch to REDIS
# when running more than one, or each instance enforces the full limit separately
# — three instances would let through three times the intended traffic.
costonomy.mp.ratelimit.backend=${RATELIMIT_BACKEND:MEMORY}
costonomy.mp.ratelimit.cleanup-interval=PT5M
# Requests per window, per caller. Zero disables a limit.
# OTP is the one a script actually attacks: six digits, and a phone number is public.
costonomy.mp.ratelimit.otp-request=20
costonomy.mp.ratelimit.otp-verify=30
costonomy.mp.ratelimit.auth=60
costonomy.mp.ratelimit.search=120
costonomy.mp.ratelimit.payment=60
# Generous: a provider retrying a burst of webhooks is normal, not an attack.
costonomy.mp.ratelimit.webhook=600
costonomy.mp.ratelimit.admin-mutation=120
# Delivery request (POST /supplier-orders/{id}/delivery): calls external courier APIs,
# charges money, and creates a real booking. A legitimate supplier has one order per
# delivery, and even a busy mandi never dispatches more than a handful of orders per
# minute from one account.
# 10 per minute per user: generous enough for normal use, stops a bot dead.
costonomy.mp.ratelimit.delivery-request=10
# Reassign (POST /deliveries/{id}/reassign): triggers a new provider search.
# Less frequent than requests — a supplier who reassigns 5 times a minute is
# either hammering the API or something is very wrong with the integration.
costonomy.mp.ratelimit.delivery-reassign=5
# Cancel: same reasoning as reassign. Cancellations also have downstream cost
# (Pidge cancellation fees) so they are slightly cheaper to allow than reassigns.
costonomy.mp.ratelimit.delivery-cancel=5
# Delivery reads (GET /deliveries/{id} + events): tracking polls from the app.
# A mobile app polling every few seconds is normal. 60/min = one per second.
costonomy.mp.ratelimit.delivery-read=60

# ── Bulk Export ─────────────────────────────────────────────────────────
# Maximum number of delivery records to stream in a single export request to protect memory
costonomy.mp.admin.export.max-rows=10000

# ── Settlement ───────────────────────────────────────────────────────────
# Hourly, because the run is for whole past days and a missed hour costs nothing.
costonomy.mp.settlement.generation-interval=PT1H
costonomy.mp.settlement.reconcile-interval=PT1H

# ── File storage ─────────────────────────────────────────────────────────
# LOCAL writes to disk and serves from /files; S3 writes to a bucket. The two
# take the same keys, so switching is configuration and never a path migration.
# Until a bucket exists this stays LOCAL — S3FileStorage is not even instantiated.
costonomy.mp.storage.provider=${STORAGE_PROVIDER:LOCAL}
costonomy.mp.storage.base-url=${STORAGE_BASE_URL:http://localhost:${SERVER_PORT:7070}/costonomy-mp-api/files}
costonomy.mp.storage.local.directory=${STORAGE_DIR:./var/uploads}
# Set all three, plus STORAGE_PROVIDER=S3, when the bucket is ready. Credentials
# come from the default AWS provider chain and are deliberately not properties —
# a bucket secret in this file is a bucket secret in the repository.
costonomy.mp.storage.s3.bucket=${STORAGE_S3_BUCKET:}
costonomy.mp.storage.s3.region=${STORAGE_S3_REGION:ap-south-1}
costonomy.mp.storage.s3.endpoint=${STORAGE_S3_ENDPOINT:}

# 5 MB matches ImageBytes.MAX_BYTES and InvoiceFileSniffer.MAX_BYTES. Tomcat rejects a larger part before our
# check ever runs, so the two must agree or the error is the wrong one.
spring.servlet.multipart.max-file-size=5MB
# Room for a bill of up to 5 pages of 5 MB (D-113); every file is still checked against 5 MB.
spring.servlet.multipart.max-request-size=26MB

# Developer tools are a local convenience and nothing else. Spring already
# disables them inside a packaged archive, and the dependency is `provided` so it
# never reaches one — this is the third lock, so that devtools cannot change the
# behaviour of a deployed or a test run even if it somehow lands on the classpath.
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# ── Bills on wallet payments (D-113) ─────────────────────────────────────
# Private storage, never the public image storage above. LOCAL is for development and tests;
# ProductionProviderGuard refuses it under a production profile. For S3, credentials come from the
# default AWS provider chain and are deliberately not properties.
costonomy.mp.invoices.storage.provider=${INVOICE_STORAGE_PROVIDER:LOCAL}
costonomy.mp.invoices.storage.local.directory=${INVOICE_STORAGE_DIR:./var/invoices}
costonomy.mp.invoices.storage.s3.bucket=${INVOICE_S3_BUCKET:}
costonomy.mp.invoices.storage.s3.region=${INVOICE_S3_REGION:ap-south-1}
# Where the signed local page links point, and the key that signs them (blank: a random one per start).
costonomy.mp.invoices.link-base-url=${INVOICE_LINK_BASE_URL:http://localhost:${SERVER_PORT:7070}/costonomy-mp-api}
costonomy.mp.invoices.link-secret=${INVOICE_LINK_SECRET:}
costonomy.mp.invoices.link-ttl=${INVOICE_LINK_TTL:PT5M}
# Reading goes through the existing Costonomy cost-app API (HTTP). FAKE answers with a fixed bill (and fixed
# supplier/SKU lists) and is refused under a production profile.
# D-114: HTTP signs in as a cost-app user (username/password, kept in a private env file, never committed or
# logged) and renews the short-lived token itself. user-id and outlet are that account's cost-app ids.
# D-115: that account MUST be least-privilege: a dedicated, non-admin cost-app user whose role holds only reading
# purchase data and the invoice-extract permission, for the mapped cost outlets only. The base URL must be https
# (http only for localhost). `token` is an optional static override for quick tests only; refused in production.
costonomy.mp.invoices.reader.provider=${INVOICE_READER_PROVIDER:FAKE}
costonomy.mp.invoices.reader.base-url=${INVOICE_READER_BASE_URL:}
costonomy.mp.invoices.reader.username=${INVOICE_READER_USERNAME:}
costonomy.mp.invoices.reader.password=${INVOICE_READER_PASSWORD:}
costonomy.mp.invoices.reader.token=${INVOICE_READER_TOKEN:}
costonomy.mp.invoices.reader.auth-timeout=${INVOICE_READER_AUTH_TIMEOUT:PT15S}
costonomy.mp.invoices.reader.outlet=${INVOICE_READER_OUTLET:0}
costonomy.mp.invoices.reader.user-id=${INVOICE_READER_USER_ID:0}
# One extraction may take 60 s, plus 45 s for each page after the first, at most 5 minutes (D-115). A timeout is
# never retried at once: the retry job tries again later.
costonomy.mp.invoices.reader.timeout=${INVOICE_READER_TIMEOUT:PT60S}
costonomy.mp.invoices.reader.timeout-per-extra-page=${INVOICE_READER_TIMEOUT_PER_EXTRA_PAGE:PT45S}
costonomy.mp.invoices.reader.timeout-max=${INVOICE_READER_TIMEOUT_MAX:PT5M}
# D-115: which cost-app outlet each marketplace outlet may see: mpOutletId:costOutletId pairs, comma separated
# ("1:1,7:12"). An outlet without one gets no supplier/SKU lookups and its bills are read without the cost app's
# matches. The fallback (every outlet uses reader.outlet) applies only when the map is empty and it is exactly true;
# it is for local use and refused in production, as an empty map is.
costonomy.mp.invoices.cost-outlet-map=${INVOICE_COST_OUTLET_MAP:}
costonomy.mp.invoices.cost-outlet-fallback=${INVOICE_COST_OUTLET_FALLBACK:false}
# A bill still READING is tried again when it is older than retry-min-age, up to max-attempts in all.
costonomy.mp.invoices.retry-interval=${INVOICE_RETRY_INTERVAL:PT2M}
costonomy.mp.invoices.retry-min-age=${INVOICE_RETRY_MIN_AGE:PT1M}
# max-attempts is also the ceiling on extraction calls for one bill, whatever their outcome (D-115).
costonomy.mp.invoices.max-attempts=${INVOICE_MAX_ATTEMPTS:5}
# D-115: the cost app unavailable (sign-in refused, 403, 408, 429, 5xx) uses no attempt; the next try waits 1, 2, 4...
# minutes, at most 30; after max-unavailable such tries the bill is UNREADABLE.
costonomy.mp.invoices.unavailable-backoff-base=${INVOICE_UNAVAILABLE_BACKOFF_BASE:PT1M}
costonomy.mp.invoices.unavailable-backoff-max=${INVOICE_UNAVAILABLE_BACKOFF_MAX:PT30M}
costonomy.mp.invoices.max-unavailable=${INVOICE_MAX_UNAVAILABLE:48}
costonomy.mp.invoices.daily-cap=${INVOICE_DAILY_CAP:20}
# D-116: payments from the wallet created on or after this date (yyyy-MM-dd, from midnight Asia/Kolkata) show
# "Bill pending" in the History until a bill is added or 'No bill needed' is set. Blank turns it off: nothing is
# pending anywhere, and bills that exist still show their status. Set it to the day the feature goes live.
costonomy.mp.invoices.tracking-start=${INVOICE_TRACKING_START:}
# The review screen's supplier/SKU pickers (D-114): read-only GETs to the cost app, cached 60 s, limited per outlet.
costonomy.mp.invoices.lookups.per-minute=${INVOICE_LOOKUPS_PER_MINUTE:60}
costonomy.mp.invoices.lookups.timeout=${INVOICE_LOOKUPS_TIMEOUT:PT15S}
