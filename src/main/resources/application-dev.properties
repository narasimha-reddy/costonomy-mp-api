# Local development (profile "dev"). Only what differs from production; connection details and secrets come from
# .env.local (git-ignored; template .env.example): the shared dev MySQL (MP_DB=costonomy_mp) and the local common-api.

# Port for `mvn spring-boot:run` and the local Docker stack (the servers run the WAR on Tomcat's port)
server.port=${SERVER_PORT:7070}

# Console only, no log file
logging.file.name=
logging.level.com.costonomy.mp=DEBUG
logging.level.org.flywaydb=INFO

# The local web builds may open a realtime socket: the web app (7074), Expo web (19006, 8081) and 7071
costonomy.mp.realtime.allowed-origins=${REALTIME_ALLOWED_ORIGINS:http://localhost:7071,http://127.0.0.1:7071,http://localhost:7074,http://127.0.0.1:7074,http://localhost:19006,http://localhost:8081,http://127.0.0.1:8081}

# Images and bill pages are served by this process on the laptop
costonomy.mp.storage.base-url=${STORAGE_BASE_URL:http://localhost:${SERVER_PORT:7070}/costonomy-mp-api/files}
costonomy.mp.invoices.link-base-url=${INVOICE_LINK_BASE_URL:http://localhost:${SERVER_PORT:7070}/costonomy-mp-api}

# A recompile restarts the app in about five seconds (devtools is `provided`, so only source runs have it)
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=false
